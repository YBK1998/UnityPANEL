<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Panel Wire Viewer icon: a wiring node-graph. Central node links out to
       terminal nodes; the lower link is red to echo the graph's 'out' colour. -->
  <rect x="6" y="6" width="244" height="244" rx="46" ry="46" fill="#2b3140"/>
  <rect x="6" y="6" width="244" height="244" rx="46" ry="46" fill="none" stroke="#4a5468" stroke-width="6"/>

  <!-- links (drawn first so the node circles sit on top of the ends) -->
  <g stroke-linecap="round" fill="none">
    <line x1="128" y1="128" x2="74"  y2="74"  stroke="#9aa3b8" stroke-width="13"/>
    <line x1="128" y1="128" x2="186" y2="78"  stroke="#9aa3b8" stroke-width="13"/>
    <line x1="128" y1="128" x2="128" y2="200" stroke="#e0574f" stroke-width="13"/>
  </g>

  <!-- terminal nodes -->
  <circle cx="74"  cy="74"  r="22" fill="#c2c8d6"/>
  <circle cx="186" cy="78"  r="22" fill="#c2c8d6"/>
  <circle cx="128" cy="200" r="22" fill="#e0574f"/>

  <!-- central node -->
  <circle cx="128" cy="128" r="34" fill="#3da0ff"/>
  <circle cx="128" cy="128" r="34" fill="none" stroke="#d6ebff" stroke-width="6"/>
</svg>
